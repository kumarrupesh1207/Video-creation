<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0B0E14" />
  <title>Aurora Studio</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo"></span><b>Aurora</b><small>Studio</small></div>
    <div id="topStatus" class="pill">Idle</div>
  </header>

  <main>
    <!-- CREATE -->
    <section id="tab-create" class="tab active">
      <form id="createForm" class="card" autocomplete="off">
        <div class="field">
          <span class="lbl">Start from</span>
          <div class="seg" id="sourceSeg" role="radiogroup">
            <button type="button" data-v="prompt" class="on">Prompt</button>
            <button type="button" data-v="upload">Upload photo</button>
          </div>
        </div>

        <div id="uploadBox" hidden>
          <label>Photo <span class="opt">(jpg/png/webp, max 15 MB)</span>
            <input id="photo" type="file" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp">
          </label>
          <img id="photoPreview" class="preview" alt="" hidden>
          <p id="photoInfo" class="hint"></p>
          <div class="seg" id="restyleSeg" role="radiogroup">
            <button type="button" data-v="asis" class="on">Use photo as-is</button>
            <button type="button" data-v="restyle">Restyle with prompt (ComfyUI)</button>
          </div>
          <label id="faceWrap" class="check" hidden><input id="faceLock" type="checkbox" checked> <span>Face lock <em>Keeps the same face (IP-Adapter). Needs the ComfyUI IPAdapter node.</em></span></label>
          <label id="denoiseWrap" hidden>Keep original: <b id="keepLabel">45%</b>
            <input id="denoise" type="range" min="0.35" max="0.75" step="0.05" value="0.45">
            <span class="hint">More original ← → more change. Restyle runs on CPU: ~5–10 min.</span>
          </label>
          <p class="hint">No sexual content; don’t impersonate real people.</p>
        </div>

        <label><span id="promptLabel">Prompt</span>
          <textarea id="prompt" rows="4" maxlength="1000" placeholder="e.g. a man in a navy suit in a city at night"></textarea>
        </label>
        <label>Negative prompt <span class="opt">(optional)</span>
          <textarea id="negative" rows="2" maxlength="600" placeholder="e.g. blurry, extra fingers, watermark"></textarea>
        </label>

        <div class="field">
          <span class="lbl">Output</span>
          <div class="seg" id="modeSeg" role="radiogroup">
            <button type="button" data-v="image">Image only</button>
            <button type="button" data-v="reel" class="on">Image → Reel</button>
          </div>
        </div>

        <div class="field" id="motionWrap">
          <span class="lbl">Motion</span>
          <div class="seg" id="motionSeg" role="radiogroup">
            <button type="button" data-v="camera" class="on">Camera (local, ~30 s)</button>
            <button type="button" data-v="ai">AI motion (Kaggle free GPU, ~15–20 min)</button>
          </div>
          <label id="actionWrap" hidden>Action <span class="opt">(optional)</span>
            <input id="action" maxlength="300" placeholder="e.g. he runs toward the train">
          </label>
        </div>

        <div class="field">
          <span class="lbl">Aspect ratio</span>
          <div class="seg" id="aspectSeg" role="radiogroup">
            <button type="button" data-v="9:16" class="on">9:16</button>
            <button type="button" data-v="1:1">1:1</button>
            <button type="button" data-v="16:9">16:9</button>
            <button type="button" data-v="custom">Custom</button>
          </div>
          <div class="row" id="customSize" hidden>
            <label>Width <input id="cw" type="number" min="256" max="2160" step="2" value="1080" inputmode="numeric"></label>
            <label>Height <input id="ch" type="number" min="256" max="2160" step="2" value="1920" inputmode="numeric"></label>
          </div>
        </div>

        <div class="row" id="reelOpts">
          <label>Duration (s) <input id="duration" type="number" min="3" max="60" value="15" inputmode="numeric"></label>
          <label>FPS <input id="fps" type="number" min="12" max="60" value="24" inputmode="numeric"></label>
        </div>

        <label id="musicWrap">Music <span class="opt">(optional · mp3/wav/m4a)</span>
          <span class="file">
            <input id="music" type="file" accept=".mp3,.wav,.m4a,.aac,.ogg,audio/*">
            <span id="musicName">No file chosen — reel will be silent</span>
          </span>
        </label>

        <label>Image provider
          <select id="provider">
            <option value="auto">Auto (config order)</option>
            <option value="local_comfyui">ComfyUI (local, free, slow on CPU)</option>
            <option value="nvidia_nim">NVIDIA NIM (uses credits)</option>
          </select>
        </label>
        <p id="providerHint" class="hint"></p>

        <p id="formMsg" class="hint" role="status"></p>
        <div class="submitbar">
          <div id="estimate" class="estimate"></div>
          <button id="submit" class="btn primary" type="submit">Generate</button>
        </div>
      </form>
    </section>

    <!-- QUEUE -->
    <section id="tab-queue" class="tab">
      <div id="activeJob" class="card"></div>
      <h2>Recent jobs</h2>
      <div id="jobList" class="list"></div>
      <details class="card"><summary>Live logs</summary><pre id="logs" class="logs"></pre></details>
    </section>

    <!-- GALLERY -->
    <section id="tab-gallery" class="tab">
      <div class="bar"><h2>Gallery</h2><button id="openFolder" class="btn ghost small" type="button">Open folder</button></div>
      <div id="gallery" class="grid"></div>
    </section>

    <!-- SYSTEM -->
    <section id="tab-system" class="tab">
      <div class="card" id="metrics"></div>
      <div class="card" id="providers"></div>
    </section>
  </main>

  <nav class="tabbar">
    <button data-tab="create" class="on">Create</button>
    <button data-tab="queue">Queue<i id="qBadge" hidden></i></button>
    <button data-tab="gallery">Gallery</button>
    <button data-tab="system">System</button>
  </nav>

  <div id="viewer" class="viewer" hidden>
    <button id="viewerClose" class="btn ghost" type="button">✕ Close</button>
    <div id="viewerBody"></div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
