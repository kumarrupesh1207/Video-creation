# ============================================================
# AI Video Factory — Master Config
# Windows 11 · 12 GB VRAM · 9:16 Vertical (Reels/Shorts)
# ============================================================
# HOW TO USE:
#   1. Run src/inspect_workflow.py to get your real node IDs
#   2. Replace the placeholder node IDs ("6", "10", "12") below
#      with the actual IDs from your workflow_api.json
#   3. Set your actual model/tool paths under [paths] and [models]
# ============================================================

project:
  name: "video_factory"
  resolution: [720, 1280]       # 9:16 vertical — 720p VRAM-safe (9.2 GB on 12GB card)
  fps: 24
  output_format: "mp4"

paths:
  base_output:      "outputs/"
  scripts_dir:      "outputs/scripts/"
  images_dir:       "outputs/images/"
  videos_dir:       "outputs/videos/"
  audio_dir:        "outputs/audio/"
  final_dir:        "outputs/final/"
  reference_voice:  "assets/reference_voice.wav"
  face_reference:   "assets/face_reference.jpg"
  wav2lip_root:     "C:/tools/Wav2Lip"
  ffmpeg_bin:       "C:/Rupesh/App/ffmpeg/bin/ffmpeg.exe"

assets:
  reuse_existing_asset: true

audio:                             # voiceover engines: see assets/voices/README.md
  voice_engine: "auto"             # auto = edge -> xtts -> piper | edge | xtts | piper
  voice_gender: "female"           # female | male
  voice: ""                        # optional edge voice override, e.g. "hi-IN-MadhurNeural"
  speaker_wav: ""                  # optional XTTS cloning sample, e.g. "assets/voices/me.wav"
  rate: "+0%"                      # edge speaking rate, e.g. "-10%"
  pitch: "+0Hz"

research:                          # aurora/research.py (Gemini text, free tier; key from AI Studio)
  model: "gemini-3.1-flash-lite"    # free-tier text model id; change here if Google retires it
  grounding: false                 # Google Search grounding is paid-only
  max_parts: 2 # LEGACY (non-chapter stories only); chapters use comic.chapter_parts                     # comic stories are 1-2 parts
  api_key_env: "GEMINI_API_KEY"

comic:                             # aurora/comic.py image settings (ComfyUI first, NIM fallback)
  steps: 20
  comfy_resolution: [512, 896]     # 9:16, SD1.5-friendly
  nim_resolution: [576, 1024]      # 9:16 (NIM maps it to 768x1344)
  layout:                          # full-bleed art by default; bands: true = reserved bands (top/art/dialogue) instead
    bands: false
    top_h: 330                     # narration band (y 0-330)
    art_h: 1170                    # image + Ken Burns window (y 330-1500)
    dialogue_h: 190                # speech-bubble band (y 1500-1690); below it stays empty (Shorts/Reels UI)
    right_safe: 120                # no text in the right 120 px
    margin: 60
  comfy_timeout_sec: 1800          # per-image floor; later panels get max(floor, 3 x median of the images so far)
  timeout_multiplier: 3
  cast_lock: true                  # channel casts in assets/characters/<channel>/ are reused verbatim (never a new look)
  chapter_parts: 10                # Series -> Chapter N -> Part M: parts per chapter (minimum 10); one ~30 s Short each
  nim_comfy_fallback: false        # nim mode never touches ComfyUI; true = after a NIM failure, preflight ComfyUI then draw the rest with IP-Adapter
  image_mode: nim                  # nim (default) | auto (ComfyUI first) | comfy (ComfyUI only)
  max_nim_credits_per_reel: 8      # NIM credits one comic reel may use (panels per reel)

motion:
  liveportrait:
    enabled: true
    request_dir: "outputs/liveportrait_requests"
    response_dir: "outputs/liveportrait_responses"
    archive_dir: "outputs/liveportrait_archived_requests"
    aurora_log: "aurora.jsonl"
    wait_for_remote_response_sec: 120
  i2v:
    enabled: true
    request_dir: "outputs/i2v_requests"
    response_dir: "outputs/i2v_responses"
    archive_dir: "outputs/i2v_archived_requests"
    aurora_log: "aurora.jsonl"
    wait_for_remote_response_sec: 120
    min_vram_mb: 8192
    recommended_vram_mb: 12288
    framepack_high_fidelity_vram_mb: 24576
    svdxt:
      model_id: "stabilityai/stable-video-diffusion-img2vid-xt"
      width: 576
      height: 1024
      num_frames: 25
      fps: 5
      motion_bucket_id: 127
      decode_chunk_size: 4
      noise_aug_strength: 0.08
      num_inference_steps: 25
    framepack:
      repo_dir: ""
      python_bin: "python"
      entry_script: "inference.py"
      driver_video: ""
      output_dir: "outputs/framepack_worker_runs"
    wan2gp:
      runtime_cmd: ""
      output_dir: "outputs/wan2gp_worker_runs"
    google:                          # PAID tier (Veo / Gemini Omni). OFF; needs GEMINI_API_KEY + billing + a budget
      enabled: false
      model: "gemini-omni-1.1-flash"  # or a veo-* id; preview ids shut down 2026-10-22, check ai.google.dev/gemini-api/docs
      resolution: "720p"
      generate_audio: true
      clip_seconds: 8
      rate_usd_per_sec: 0.10         # estimate used for the budget guard (Lite 0.05, Fast/Omni 0.10, standard 0.40)
      monthly_budget_inr: 0          # 0 = refuse every call; e.g. 500 allows about Rs 500/month
      usd_inr: 85
      api_key_env: "GEMINI_API_KEY"
    kaggle:                          # free-GPU tier ("AI motion"); motion_mode "kaggle_provider"; falls back to local FFmpeg
      enabled: true                  # needs KAGGLE_USERNAME/KAGGLE_KEY in .env
      timeout_sec: 3600
      poll_sec: 20
      model: "Wan-AI/Wan2.2-TI2V-5B-Diffusers"   # 24 GB model: runs with offload at 480p on 16 GB Kaggle GPUs
      width: 576                     # 16 GB Kaggle T4: 832x480x49 OOMs in attention
      height: 320
      num_frames: 33
      steps: 25
      segments: 2                    # chained clips per job; quality drifts badly by the 3rd (tested 2026-10-21)
      keep_ratio: 0.75

providers:
  default: "nvidia_nim"
  fallback_order: ["nvidia_nim", "local_comfyui", "manual_upload"]
  nvidia_nim:
    enabled: true
    base_url: "https://ai.api.nvidia.com/v1/genai/"
    endpoint_mode: "direct_model"
    credit_cost: 1.0
    models:
      anime: "black-forest-labs/flux.2-klein-4b"
      cinematic: "black-forest-labs/flux.2-klein-4b"
    timeout: 60
    quota: 80
    max_credits_per_day: 25          # hard daily cap on NIM credits for comic reels (3 reels x ~7 images); the real balance is not readable from the API
  local_comfyui:
    cfg: 5.5
    steps: 25
    sampler_name: "dpmpp_2m"
    scheduler: "karras"
    anime_checkpoint: "Counterfeit-V2.5_fp16.safetensors"   # used when style == anime (CreativeML OpenRAIL-M)
    reference_weight: 0.4            # IP-Adapter strength for comic panels (0.7 copied the reference pose into every panel)
    default_resolution: [512, 768]   # used when the request gives none
    refine:                          # optional hires-fix style 2nd pass (slow on CPU)
      enabled: false
      scale: 1.5
      denoise: 0.45
      steps: 15
    negative_prompt: "lowres, bad anatomy, bad hands, extra fingers, deformed, text, error, missing fingers, extra digit, fewer digits, cropped, worst quality, low quality, normal quality, jpeg artifacts, signature, watermark, username, blurry, artist name"
  manual_upload:
    enabled: true

models:

  # ── LLM (CPU / RAM only — no VRAM) ─────────────────────────────────────
  llm:
    provider:       "ollama"
    model_name:     "llama3:8b"
    endpoint:       "http://127.0.0.1:11434/api/generate"
    temperature:    0.7
    max_tokens:     1024

  # ── ComfyUI WebSocket API ───────────────────────────────────────────────
  comfyui:
    host:           "127.0.0.1"
    port:           8188
    ws_url:         "ws://127.0.0.1:8188/ws"
    api_url:        "http://127.0.0.1:8188"
    client_id:      "video_factory_client_01"
    auto_start:     true
    startup_timeout_sec: 180
    launcher_dir:   "C:/Rupesh/App/ComfyUI_windows_portable_nvidia/ComfyUI_windows_portable"
    launcher_cmd:   [".\\python_embeded\\python.exe", "-s", "ComfyUI\\main.py", "--cpu", "--windows-standalone-build"]

    # ── Image Generation Workflow ──────────────────────────────────────
    image_workflow: "src/workflows/image_gen.json"
    # Node IDs — run: python src/inspect_workflow.py --workflow workflow_api.json
    # Replace placeholder IDs ("6", "10") with real IDs from your workflow
    image_overrides:
      positive_prompt_node: "6"      # CLIPTextEncode (positive)
      negative_prompt_node: "7"      # CLIPTextEncode (negative)
      latent_size_node:     "5"      # EmptyLatentImage
      sampler_node:         "3"      # KSampler
      output_node:          "10"     # SaveImage (node 10 — after VAELoader on 8)

    # ── SVD Video Workflow ─────────────────────────────────────────────
    video_workflow: "src/workflows/svd_video.json"
    video_overrides:
      image_input_node:     "10"     # LoadImage (feed keyframe from image stage)
      svd_conditioning_node: "11"    # SVD_img2vid_Conditioning
      output_node:          "12"     # VHS_VideoCombine or SaveImage

  # ── Coqui XTTS-v2 (loads to GPU, must be unloaded before Wav2Lip) ──────
  xtts:
    model_name:     "tts_models/multilingual/multi-dataset/xtts_v2"
    language:       "en"
    speed:          1.0
    temperature:    0.65
    # TTS cache dir (avoid re-downloading on each run)
    # Set env var TTS_HOME or let Coqui use default ~/.local/share/tts

  # ── Wav2Lip (isolated Python 3.8 venv — NEVER shares VRAM with XTTS) ───
  wav2lip:
    # ⚠️ HIGH RISK: Use the Wav2Lip-specific Python 3.8 venv below
    python_bin:       "C:/tools/Wav2Lip/venv/Scripts/python.exe"
    inference_script: "C:/tools/Wav2Lip/inference.py"
    checkpoint:       "C:/tools/Wav2Lip/checkpoints/wav2lip_gan.pth"
    resize_factor:    1
    pad_top:          0
    pad_bottom:       10
    pad_left:         0
    pad_right:        0

  # ── FFmpeg Upscale / Encode ──────────────────────────────────────
  upscale:
    enabled:        true
    # 720x1280 → 1080x1920 (1.5x Lanczos — sharp, fast)
    # If OOM: set resolution to [512, 896] in config or --resolution 512 896
    ffmpeg_crf:     18             # 18 = visually lossless; raise to 23 for smaller file
    ffmpeg_preset:  "slow"         # slow = better compression at same CRF

# ── VRAM Cleanup Protocol ─────────────────────────────────────────────────────
# These flags are read by main.py's vram_cleanup() utility.
# Do NOT disable unless you have >20 GB VRAM.
vram:
  cleanup_between_phases: true
  torch_gc_after_each_module: true
  sleep_after_cleanup_sec: 2
  comfyui_free_memory_endpoint: "/free"

# ── Autopilot (research → create → veto window → publish) ──────────────
autopilot:
  publish:
    enabled: false          # GLOBAL KILL-SWITCH: nothing uploads while false (even without --dry-run). Set true only when told to go.
    upload_ahead: true      # after the veto window: upload private + publishAt=slot (YouTube publishes while the PC is off)
    approval: veto         # auto-publish after veto_hours unless stopped
    veto_hours: 6
    slots: ["12:30", "18:30", "21:00"]   # IST; one reel per slot
    timezone: Asia/Kolkata
    max_attempts: 3
  channels:
    - name: main            # token: outputs/tokens/youtube_main.json ("Rupesh Kumar" channel)
      niche: "original anime short stories with original characters (no existing copyrighted characters): epic battles, emotional moments, power-ups, mysterious worlds"
      language: en
      platforms: [youtube]
      reels_per_day: 3
      motion: ai            # free Kaggle AI motion; falls back to camera motion
      voice: en-US-AvaNeural   # young adult female, natural
      format: comic         # motion-comic series (aurora/comic.py); omit for plain image reels
      panels: 6
      render_enabled: false   # main is NOT used right now: never rendered
      publish_enabled: false  # ... and never published
    - name: shinobi         # token: outputs/tokens/youtube_shinobi.json; run: python -m aurora.publish.youtube auth --channel shinobi
      expected_handle: "@ShinobiMindset1"   # upload is refused if the token belongs to another channel
      niche: "original anime short stories with original characters (no existing copyrighted characters): epic battles, emotional moments, power-ups, mysterious worlds"
      language: en
      platforms: [youtube]
      reels_per_day: 2        # 2 Shorts/day
      slots: ["12:30", "18:30"]   # IST
      # long_episode: {weekday: saturday, time: "18:00"}   # OFF: replaced by the Saturday 18:00 CHAPTER COMPILATION (aurora/chapter.py); aurora/episode.py stays for manual use
      publish_enabled: true   # per-channel go-live (global autopilot.publish.enabled stays false)
      motion: ai
      voice: en-US-AvaNeural
      format: comic
      seo: true             # SEO-researched title/description/tags (aurora/publish/seo.py); falls back to plain metadata
      panels: 6             # cast: assets/characters/shinobi (copy of main's locked cast, Kaelen)

# Manga-dialogue series (aurora/manga.py). Script: docs/stories/<series>/CHAPTER_NN.md. NOT queued/published until the user says go.
manga_series:
  veer:
    channel: shinobi
    title: "VEER – Wrath of the Forgotten God"
    playlist: "VEER – Wrath of the Forgotten God"
    script_dir: docs/stories/veer
    reserve_credits: 14              # NIM credits/day kept for Echoes of the Aether (2 parts/day); Veer only renders with what is left
    enabled: false                   # autopilot does not schedule it yet
